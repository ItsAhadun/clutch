<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clutch</title>
<!-- Keycap design system: tokens and rules in DESIGN.md. -->
<style>
  :root {
    --bg: #1a1b1e; --well: #141517; --cap: #2a2b30; --cap-edge: #0e0f11; --line: #2e2f35;
    --text: #ecebe8; --muted: #8d8c92; --pink: #ff4f9a; --pink-edge: #b8306c; --on-pink: #1a0b12;
    --red: #ff6b5e; --red-bg: #3a1e1c;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--text);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 14px; display: grid; gap: 14px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Keys: the one shape for shortcuts and buttons. A key sits on a 3px edge and drops onto it when pressed. */
  kbd { font: 600 12px/1 var(--mono); padding: 8px 10px 9px; min-width: 32px; text-align: center; border-radius: 6px;
        background: var(--cap); box-shadow: inset 0 -3px 0 var(--cap-edge); }
  .key { padding: 7px 12px 8px; border: 0; border-radius: 7px; font-weight: 600; cursor: pointer; white-space: nowrap;
         background: var(--cap); box-shadow: inset 0 -3px 0 var(--cap-edge); transition: transform .06s, box-shadow .06s; }
  .key:hover { filter: brightness(1.12); }
  .key:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--cap-edge); }
  .key.pink { background: var(--pink); color: var(--on-pink); box-shadow: inset 0 -3px 0 var(--pink-edge); }
  .key.pink:active { box-shadow: inset 0 -1px 0 var(--pink-edge); }
  .key.wide { width: 100%; }

  /* Hero: the shortcut, printed as keys. Its last key is the one that does the work. */
  .hero { display: grid; gap: 8px; padding: 14px; border-radius: 10px; background: var(--well); }
  #caps { display: flex; gap: 6px; }
  #caps:empty { display: none; }
  #caps kbd:last-child { color: var(--pink); }
  .hero p { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--muted); font-size: 12px; }
  .link { padding: 0; border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .link:hover { color: var(--text); }

  /* Account rows */
  #list { list-style: none; margin: 0; padding: 0; display: grid; }
  .card { position: relative; border-radius: 7px; }
  .card:hover, .active { background: var(--cap); }
  .main { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 8px 8px 12px;
          background: none; border: 0; border-radius: 7px; text-align: left; cursor: pointer; }
  .active .main { cursor: default; }
  .active::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--pink); }
  /* Same rounded square, initials and color as the toolbar badge. */
  .badge { flex: none; width: 26px; height: 20px; border-radius: 4px; display: grid; place-items: center;
           font: 700 10px var(--mono); color: #fff; }
  .dead .badge { background: transparent !important; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
  .handle { flex: 1; min-width: 0; font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dead .handle { color: var(--muted); }
  .tag { flex: none; font: 11px var(--mono); color: var(--muted); }
  .active .tag { color: var(--pink); }
  .dead .tag { color: var(--red); }
  .rename-input { flex: 1; min-width: 0; padding: 2px 6px; border: 1px solid var(--muted); border-radius: 5px;
                  background: var(--well); font: 12.5px var(--mono); }

  /* Rename and delete slide in over the tag. */
  .actions { position: absolute; right: 4px; top: 50%; translate: 0 -50%; display: flex; gap: 2px; padding-left: 18px;
             background: linear-gradient(to right, transparent, var(--cap) 14px); opacity: 0; pointer-events: none; transition: opacity .1s; }
  .card:hover .actions, .card:focus-within .actions, .actions:has(.confirm) { opacity: 1; pointer-events: auto; }
  .icon { width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 5px;
          background: none; color: var(--muted); cursor: pointer; }
  .icon:hover { background: var(--bg); color: var(--text); }
  .icon svg { width: 14px; height: 14px; }
  .icon.confirm { width: auto; padding: 0 8px; background: var(--red); color: var(--on-pink); font-size: 12px; font-weight: 600; }

  .empty { margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: 7px; color: var(--muted); text-align: center; }
  .empty b { display: block; color: var(--text); margin-bottom: 2px; }

  .save { display: flex; gap: 6px; }
  .save input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--well); }
  .save input::placeholder { color: var(--muted); }
  .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

  #err:empty { display: none; }
  #err { margin: 0; padding: 8px 10px; border-radius: 7px; background: var(--red-bg); color: var(--red); font-size: 12px; }

  /* Settings */
  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary, .group { font: 600 11px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  summary { list-style: none; cursor: pointer; }
  summary:hover { color: var(--text); }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .settings { display: grid; gap: 4px; margin-top: 8px; }
  .group { margin: 10px 0 0; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; cursor: pointer; }
  .toggle small { display: block; color: var(--muted); font-size: 12px; }
  .toggle kbd { font-size: 11px; padding: 1px 5px 3px; min-width: 0; box-shadow: inset 0 -2px 0 var(--cap-edge); }
  /* A slider switch with a square knob, sunk into the panel. */
  .toggle input { appearance: none; flex: none; margin: 0; width: 34px; height: 20px; border-radius: 5px; background: var(--cap);
                  box-shadow: inset 0 1px 2px rgba(0,0,0,.5); position: relative; cursor: pointer; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 3px;
                         background: var(--muted); transition: transform .12s, background .12s; }
  .toggle input:checked::after { background: var(--pink); transform: translateX(14px); }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div id="caps"></div>
    <p><span id="keysHint"></span><button class="link" id="shortcut"></button></p>
  </section>

  <ul id="list" aria-label="Saved accounts"></ul>
  <p class="empty" id="empty"><b>No saved accounts</b>
    Log in on Instagram, then press Save login.</p>

  <p id="err" role="alert"></p>

  <div class="save">
    <input id="label" placeholder="Name this login (optional)" aria-label="Account name">
    <button class="key pink" id="capture">Save login</button>
  </div>

  <section>
    <button class="key wide" id="addAccount">+ Add another account</button>
    <p class="note">Logs you out in this browser only. Instagram's own Log out and account switcher end saved logins.</p>
  </section>
  <details>
    <summary>Settings</summary>
    <div class="settings">
      <label class="toggle"><span>Open saved posts after a switch</span>
        <input type="checkbox" id="goHome"></label>
      <label class="toggle"><span>Clear site data on switch
        <small>Turn on if the old account's feed sticks</small></span>
        <input type="checkbox" id="clearStorage"></label>
      <label class="toggle"><span>Your story button
        <small>Post photos and videos to your story, with text and music</small></span>
        <input type="checkbox" data-video="story"></label>

      <h2 class="group">Video player</h2>
      <label class="toggle"><span>Seek bar</span><input type="checkbox" data-video="seek"></label>
      <label class="toggle"><span>Volume slider</span><input type="checkbox" data-video="volume"></label>
      <label class="toggle"><span>Playback speed</span><input type="checkbox" data-video="speed"></label>
      <label class="toggle"><span>Fullscreen button</span><input type="checkbox" data-video="fullscreen"></label>
      <label class="toggle"><span>Transcript button
        <small>Copy a Reel's text: Instagram's captions, or transcribed on this computer</small></span>
        <input type="checkbox" data-video="transcript"></label>
      <label class="toggle"><span>Auto-scroll Reels
        <small>Go to the next Reel when one ends</small></span>
        <input type="checkbox" data-video="autoscroll"></label>
      <label class="toggle"><span>Keyboard shortcuts
        <small><kbd>Space</kbd> play/pause, <kbd>M</kbd> mute, <kbd>F</kbd> fullscreen, <kbd>←</kbd> <kbd>→</kbd> skip 5 seconds (<kbd>Shift</kbd>+arrows in stories and posts)</small></span>
        <input type="checkbox" data-video="keys"></label>
      <label class="toggle"><span>Search on <kbd>Ctrl</kbd>+<kbd>F</kbd>
        <small>Open Explore with the search box ready to type in</small></span>
        <input type="checkbox" data-video="search"></label>
      <label class="toggle"><span>Keep playing in background
        <small>Don't pause when you switch tabs</small></span>
        <input type="checkbox" data-video="background"></label>
      <label class="toggle"><span>Feature menu on <kbd>?</kbd>
        <small>Lists everything the extension does</small></span>
        <input type="checkbox" data-video="menu"></label>
      <label class="toggle"><span>Corner <kbd>?</kbd> button</span><input type="checkbox" data-video="corner"></label>
    </div>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
